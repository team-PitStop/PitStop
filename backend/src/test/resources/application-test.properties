# Test profile: runs against a throwaway `pitstop_test` database so the suite
# never touches a developer's local `pitstop` data. Flyway builds the schema
# from the same migrations production uses, and Hibernate validates against it.
spring.datasource.url=jdbc:postgresql://localhost:5432/pitstop_test
spring.datasource.username=${DB_USER:${user.name}}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

jwt.secret=test-only-secret-0123456789-0123456789-0123456789
jwt.expiration-ms=86400000

logging.level.root=WARN
logging.level.org.springframework=WARN
